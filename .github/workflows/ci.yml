name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          MOCK_MUSIC: "1"
          NEXT_PUBLIC_GAME_SERVER_URL: http://127.0.0.1:8090
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: e2e (Playwright)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - uses: actions/checkout@v4
        with:
          repository: bunjonglak123/songquiz-server
          path: songquiz-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: songquiz-server/go.mod
          cache-dependency-path: songquiz-server/go.sum
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SONGQUIZ_SERVER_DIR: songquiz-server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No env files tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env[^/]*|[^/]*\.env|\.envexample)$'; then
            echo "::error::env file is tracked by git"; exit 1
          fi
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact
