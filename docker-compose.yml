# docker compose up --build  →  http://localhost:3000
# With no Supabase values the game runs in multi-tab mode: open several tabs in one
# browser, each tab is a player. Songs come from Apple Music previews (no key needed).
# Set MOCK_MUSIC=1 to use made-up songs and generated tones instead (fully offline).
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${NEXT_PUBLIC_SPOTIFY_CLIENT_ID:-}
    ports:
      - "3000:3000"
    environment:
      MOCK_MUSIC: ${MOCK_MUSIC:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DECK_SECRET: ${DECK_SECRET:-}
    restart: unless-stopped
